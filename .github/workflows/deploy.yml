# Déploiement continu du site Écolio sur l'hébergement cPanel LWS.
# À chaque push sur main : vérification TypeScript + build Vite, puis envoi du dossier dist/
# par FTPS dans le dossier du domaine ecolio.site (seuls les fichiers modifiés sont envoyés).
#
# Secrets GitHub requis (Settings > Secrets and variables > Actions) :
#   FTP_SERVER    ex. web41.lws-hosting.com
#   FTP_USERNAME  compte FTP dont le dossier est la racine du site ecolio.site
#   FTP_PASSWORD
#
# Le dossier « api » présent sur le serveur (lien vers l'application Node.js créé par cPanel)
# n'a jamais été envoyé par ce workflow : il n'est donc jamais modifié ni supprimé.
name: Build et déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc (vérification des types) puis vite build ; public/.htaccess est copié dans dist/
      - run: npm run build

      - name: Secrets FTP configurés ?
        if: env.FTP_SERVER == ''
        run: |
          echo "::warning::Secrets FTP_SERVER / FTP_USERNAME / FTP_PASSWORD absents : déploiement ignoré (build OK)."

      - name: Envoi FTPS vers le serveur
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./

      - name: Vérification du site
        if: env.FTP_SERVER != ''
        run: |
          curl -fsSk -o /dev/null -w "Accueil : %{http_code}\n" https://ecolio.site/ \
            || echo "::warning::Le site ne répond pas — vérifiez https://ecolio.site"
