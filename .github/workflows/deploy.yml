# Déploiement continu du site Écolio sur l'hébergement cPanel LWS.
# À chaque push sur main : vérification TypeScript + build Vite, puis envoi du dossier dist/
# par FTPS dans le dossier du domaine ecolio.site (seuls les fichiers modifiés sont envoyés).
#
# Secrets GitHub requis (Settings > Secrets and variables > Actions) :
#   FTP_SERVER    ex. web41.lws-hosting.com
#   FTP_USERNAME  compte FTP dont le dossier est la racine du site ecolio.site
#   FTP_PASSWORD
#
# Le dossier « api » présent sur le serveur (lien vers l'application Node.js créé par cPanel)
# n'a jamais été envoyé par ce workflow : il n'est donc jamais modifié ni supprimé.
name: Build et déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc (vérification des types) puis vite build ; public/.htaccess est copié dans dist/
      - run: npm run build

      # Repère de version : la vérification finale s'assure que c'est bien ce build qui est en ligne
      - run: echo "${GITHUB_SHA}" > dist/version.txt

      - name: Secrets FTP configurés ?
        if: env.FTP_SERVER == ''
        run: |
          echo "::warning::Secrets FTP_SERVER / FTP_USERNAME / FTP_PASSWORD absents : déploiement ignoré (build OK)."

      - name: Envoi FTPS vers le serveur
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./

      - name: Vérification du site
        if: env.FTP_SERVER != ''
        # Échoue si le site en ligne n'est pas ce build : sinon les fichiers ne sont pas arrivés
        # à la racine du domaine (répertoire du compte FTP) et le déploiement serait faussement vert.
        # Paramètre unique à chaque essai pour passer le cache Varnish de l'hébergeur.
        run: |
          for i in $(seq 1 6); do
            online=$(curl -fsSk "https://ecolio.site/version.txt?deploy=${GITHUB_SHA}&try=$i" | tr -d '[:space:]' || true)
            if [ "$online" = "${GITHUB_SHA}" ]; then echo "Site OK : build ${GITHUB_SHA} en ligne"; exit 0; fi
            sleep 10
          done
          echo "Version en ligne : ${online:-aucune (version.txt introuvable)}"
          echo "::error::Le site en ligne n'est pas le build ${GITHUB_SHA}. Vérifiez que le répertoire du compte FTP est la racine du domaine ecolio.site."
          exit 1
